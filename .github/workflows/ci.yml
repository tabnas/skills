# STAGED workflow — automation sessions cannot write .github/workflows/
# (ADR-8), so this file lives in ci/ until a maintainer promotes it to
# .github/workflows/ci.yml. Byte-move it; do not adapt.
#
# This repo has no build and no polyglot runtimes: CI is exactly the
# validation script, nothing else. Action tag refs are converted to pinned
# SHAs by the org Renovate preset (ADR-6).
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24.x
      - run: node tools/validate.js

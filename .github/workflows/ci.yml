# STAGED workflow — automation sessions cannot write .github/workflows/
# (ADR-8), so this file lives in ci/ until a maintainer promotes it to
# .github/workflows/ci.yml. Byte-move it; do not adapt.
#
# This repo has no build and no polyglot runtimes: CI is exactly the
# validation script, nothing else. Action tag refs are converted to pinned
# SHAs by the org Renovate preset (ADR-6).
#
# Two runs, deliberately. The default is offline and dependency-free, so it
# passes with no network. `--online` additionally asks the registry whether
# the pinned @tabnas/mcp version exists: the pin regex checks SHAPE, and
# shape is not existence — mcp.json once pinned 0.1.0, which was tagged but
# never published, so every documented `npx --yes @tabnas/mcp@0.1.0 mcp`
# 404'd while validation stayed green. The online run is what closes that.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Validate (offline — structure, frontmatter, links, manifests)
        run: node tools/validate.js
      - name: Validate (online — the pinned MCP version must exist)
        run: node tools/validate.js --online

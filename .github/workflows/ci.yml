# Target: tabnas/skills -> .github/workflows/ci.yml
#
# This repo has no build and no polyglot runtimes: CI is exactly the
# validation script, offline, nothing else. The online checks on the
# @tabnas/mcp pin run in release.yml. Action tag refs are converted to pinned
# SHAs by the org Renovate preset (ADR-6).
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24.x
      - run: node tools/validate.js
